<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Kaya Fungo Tour & Safari</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h1>Kaya Fungo Safaris Admin Panel</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">View Site</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-container">
        <!-- Admin Login Form -->
        <div id="login-section" class="form-card">
            <h2>Administrator Login</h2>
            <form id="admin-login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
            <p id="login-error" class="error-msg"></p>
        </div>

        <!-- Authenticated Admin Control Panel -->
        <div id="admin-panel" class="hidden">
            <div class="admin-header">
                <h2>Welcome, Admin</h2>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>

            <!-- Blog Post Creator -->
            <section class="form-card">
                <h3>Add New Blog Post</h3>
                <form id="add-blog-form">
                    <div class="form-group">
                        <label for="blog-title">Blog Title</label>
                        <input type="text" id="blog-title" placeholder="e.g. 3 Days Safari to Tsavo East" required>
                    </div>
                    <div class="form-group">
                        <label for="blog-content">Post Content</label>
                        <textarea id="blog-content" rows="6" placeholder="Write your blog content here..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Publish Blog</button>
                </form>
            </section>

            <!-- Media Manager (Photos & Videos) -->
            <section class="form-card">
                <h3>Upload Photos & Videos</h3>
                <form id="upload-media-form">
                    <div class="form-group">
                        <label for="media-type">Media Type</label>
                        <select id="media-type">
                            <option value="image">Image URL</option>
                            <option value="video">Video URL / Embed Link</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="media-url">Resource URL</label>
                        <input type="text" id="media-url" placeholder="https://example.com/photo.jpg" required>
                    </div>
                    <div class="form-group">
                        <label for="media-caption">Caption</label>
                        <input type="text" id="media-caption" placeholder="Describe the photo/video">
                    </div>
                    <button type="submit" class="submit-btn">Add to Gallery</button>
                </form>
            </section>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
